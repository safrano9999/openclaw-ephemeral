# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: openclaw-ephemeral image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish"
        required: false
        default: "2026.7.1"
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true
      cascade:
        description: "Trigger the safrano9999-openclaw image after publishing"
        required: true
        type: boolean
        default: false
      deterministic_release_tag:
        description: "Immutable release tag from safrano9999/openclaw-deterministic"
        required: true
        default: "2026.7.1-deterministic.1"
        type: string
      deterministic_asset:
        description: "Release tar.gz containing the patched dist directory"
        required: true
        default: "openclaw-2026.7.1-deterministic.tar.gz"
        type: string
      deterministic_sha256:
        description: "SHA256 of the deterministic release asset"
        required: true
        default: "cb0b32c76538ce7789ccb654acdd4c00910ab62813eb68c03a3b6ec1cce1e685"
        type: string

concurrency:
  group: openclaw-ephemeral-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/safrano9999/openclaw-ephemeral
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            push_latest=true
          else
            version="${{ inputs.image_tag }}"
            push_latest="${{ inputs.push_latest }}"
          fi
          : "${version:?Image tag must not be empty}"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [ "$push_latest" = true ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Test runtime configuration
        run: python3 -m unittest discover -s tests -v

      - name: Validate deterministic release asset
        id: deterministic
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.deterministic_release_tag || '2026.7.1-deterministic.1' }}
          RELEASE_ASSET: ${{ inputs.deterministic_asset || 'openclaw-2026.7.1-deterministic.tar.gz' }}
          RELEASE_SHA256: ${{ inputs.deterministic_sha256 || 'cb0b32c76538ce7789ccb654acdd4c00910ab62813eb68c03a3b6ec1cce1e685' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^2026[.]7[.]1-deterministic[.][0-9]+$ ]]
          [[ "$RELEASE_ASSET" == openclaw-2026.7.1-deterministic.tar.gz ]]
          [[ "$RELEASE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          asset_path="${RUNNER_TEMP}/${RELEASE_ASSET}"
          curl -fsSL --retry 3 \
            "https://github.com/safrano9999/openclaw-deterministic/releases/download/${RELEASE_TAG}/${RELEASE_ASSET}" \
            -o "$asset_path"
          printf '%s  %s\n' "$RELEASE_SHA256" "$asset_path" | sha256sum -c --strict -
          tar -tzf "$asset_path" > "${RUNNER_TEMP}/deterministic-asset-files.txt"
          grep -Eq '^(./)?dist/' "${RUNNER_TEMP}/deterministic-asset-files.txt"
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'release_asset=%s\n' "$RELEASE_ASSET"
            printf 'release_sha256=%s\n' "${RELEASE_SHA256,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container/Containerfile
          build-args: |
            OPENCLAW_VERSION=2026.7.1
            OPENCLAW_DETERMINISTIC_TAG=${{ steps.deterministic.outputs.release_tag }}
            OPENCLAW_DETERMINISTIC_ASSET=${{ steps.deterministic.outputs.release_asset }}
            OPENCLAW_DETERMINISTIC_SHA256=${{ steps.deterministic.outputs.release_sha256 }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Trigger safrano9999-openclaw image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cascade }}
        env:
          GH_TOKEN: ${{ secrets.CONTAINER_ACTIONS_TOKEN }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Missing required secret CONTAINER_ACTIONS_TOKEN}"
          gh workflow run safrano9999-openclaw-image.yml \
            --repo safrano9999/CONTAINER \
            --ref main \
            -f "push_latest=${PUSH_LATEST}"

      - name: Reclaim container build space
        run: .github/scripts/prune-container-build-space.sh

      - name: Verify public Docker Hub repository
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://hub.docker.com/v2/namespaces/safrano9999/repositories/openclaw-ephemeral \
            | jq -e \
              '.name == "openclaw-ephemeral" and
               .namespace == "safrano9999" and
               .is_private == false' >/dev/null

      - name: Test published image
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker pull "$image"
          smoke_script="$RUNNER_TEMP/openclaw-ephemeral-smoke.sh"
          cat > "$smoke_script" <<'SH'
          set -euo pipefail
          /usr/local/bin/openclaw-ephemeral.py configure
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("/root/.openclaw/openclaw.json").read_text(encoding="utf-8")
          )
          assert config["agents"]["defaults"]["models"]["dummy/dummy"] == {}
          assert config["agents"]["defaults"]["models"]["dummy/note"] == {}
          assert config["agents"]["defaults"]["model"]["primary"] == "dummy/note"
          assert config["agents"]["defaults"]["sandbox"]["mode"] == "off"
          assert config["plugins"]["entries"]["note"]["enabled"] is True
          assert (
              config["plugins"]["entries"]["note"]["hooks"]["allowConversationAccess"]
              is True
          )
          assert config["tools"]["profile"] == "full"
          assert config["tools"]["exec"]["mode"] == "full"
          PY
          test -s /root/.openclaw/exec-approvals.json
          test -f /root/.openclaw/extensions/note/openclaw.plugin.json
          SH
          chmod 0755 "$smoke_script"
          docker run --rm \
            -v "$smoke_script:/tmp/openclaw-ephemeral-smoke.sh:ro" \
            --entrypoint bash \
            "$image" /tmp/openclaw-ephemeral-smoke.sh

          hook_root="$RUNNER_TEMP/openclaw-ephemeral-runtime.d"
          hook_output_dir="$RUNNER_TEMP/openclaw-ephemeral-hook-output"
          install -d -m 0755 \
            "$hook_root/pre-config.d" \
            "$hook_root/post-config.d" \
            "$hook_root/pre-gateway.d"
          install -d -m 0777 "$hook_output_dir"

          write_hook() {
            local path="$1"
            local marker="$2"
            cat > "$path" <<SH
          #!/bin/sh
          printf '%s\n' '$marker' >> /tmp/hook-output/order
          SH
            chmod 0755 "$path"
          }

          # Create the pre-config hooks out of order to verify lexical execution.
          write_hook "$hook_root/pre-config.d/20-second.sh" pre-config-20
          write_hook "$hook_root/pre-config.d/10-first.sh" pre-config-10
          write_hook "$hook_root/post-config.d/10-post.sh" post-config-10
          write_hook "$hook_root/pre-gateway.d/10-gateway.sh" pre-gateway-10

          docker run --rm \
            -e OPENCLAW_BIN=/bin/true \
            -v "$hook_root:/usr/local/share/openclaw-ephemeral/runtime.d:ro" \
            -v "$hook_output_dir:/tmp/hook-output" \
            "$image"
          printf '%s\n' \
            pre-config-10 \
            pre-config-20 \
            post-config-10 \
            pre-gateway-10 \
            | diff -u - "$hook_output_dir/order"

          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = root
          docker buildx imagetools inspect "$image" >/dev/null

  publish-github-release:
    name: Publish GitHub release page
    needs: build-test-publish
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update release from RELEASE.md
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="openclaw-ephemeral ${tag}"
          if gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file RELEASE.md
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes-file RELEASE.md
          fi
