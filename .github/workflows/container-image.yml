# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: openclaw-ephemeral image

on:
  push:
    tags:
      - "20*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish"
        required: false
        default: "2026.7.1"
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true

concurrency:
  group: openclaw-ephemeral-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/safrano9999/openclaw-ephemeral
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            push_latest=true
          else
            version="${{ inputs.image_tag }}"
            push_latest="${{ inputs.push_latest }}"
          fi
          : "${version:?Image tag must not be empty}"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [ "$push_latest" = true ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Test runtime configuration
        run: python3 -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Verify public Docker Hub repository
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://hub.docker.com/v2/namespaces/safrano9999/repositories/openclaw-ephemeral \
            | jq -e \
              '.name == "openclaw-ephemeral" and
               .namespace == "safrano9999" and
               .is_private == false' >/dev/null

      - name: Test published image
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker pull "$image"
          smoke_script="$RUNNER_TEMP/openclaw-ephemeral-smoke.sh"
          cat > "$smoke_script" <<'SH'
          set -euo pipefail
          /usr/local/bin/openclaw-ephemeral.py configure
          jq -e \
            '.agents.defaults.models["dummy/dummy"] == {} and
             .agents.defaults.models["dummy/note"] == {} and
             .agents.defaults.model.primary == "dummy/note" and
             .agents.defaults.sandbox.mode == "off" and
             .plugins.entries.note.enabled == true and
             .plugins.entries.note.hooks.allowConversationAccess == true and
             .tools.profile == "full" and
             .tools.exec.mode == "full"' \
            /root/.openclaw/openclaw.json >/dev/null
          test -s /root/.openclaw/exec-approvals.json
          test -f /root/.openclaw/extensions/note/openclaw.plugin.json
          SH
          chmod 0755 "$smoke_script"
          docker run --rm \
            -v "$smoke_script:/tmp/openclaw-ephemeral-smoke.sh:ro" \
            --entrypoint bash \
            "$image" /tmp/openclaw-ephemeral-smoke.sh
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = root
          docker buildx imagetools inspect "$image" >/dev/null
