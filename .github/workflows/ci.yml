# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Runtime tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test runtime configuration and device bridge
        run: python3 -m unittest discover -s tests -v

  openclaw-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the standard OpenClaw release
        run: npm install --prefix "$RUNNER_TEMP/upstream" --omit=dev --no-audit --no-fund openclaw@2026.11.1
      - name: Check native models, agent filters and private MCP transport
        env:
          UPGRADE_TARGET_VERSION: "2026.11.1"
          UPGRADE_TARGET_PACKAGE: ${{ runner.temp }}/upstream/node_modules/openclaw
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 180 python3 tests/integration/openclaw_config.py
